<html>
	<head>
		<title>College Application Form</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
		<style>
			body{
				margin:10px;
				border:5px solid black;
				background:URL("adilogo.jpg");
				background-position:center;
				background-repeat:no-repeat;
				font-family: "Poppins", sans-serif;
				font-weight: 600;
				font-style: normal;
			}
			
			h1{
				text-align:center;
				text-transform:uppercase;
				padding:25px 0 10px 0;
			}
			.name{
				height:30px;
				width:200px;
				padding:10px;
			}
			#fst_name{
				margin-left: 30;
			}
			#dob{
				margin-left:114;
			}
			#email{
				margin-left: 83;
			}
			#phno{
				margin-left: 69;
			}
			#ads{
				margin-left: 54;
			}
			.course{
				margin-left:200;
			}
			#date{
				margin-left:116;
			}
			
			form{
				margin:20px;
				padding: 20px 40px;
			}
			
			textarea{
				width:300;
				height:100;
				margin-left:55;
			}
			
			select{
				width: 100;
				height: 30;
				position: absolute;
				top: 446;
				left: 610;
			}
			
			#file{
				height: 32;
			} 
			button{
				border:0;
				border-radius:30px;
				padding:10px 20px;
				font-size:17px;
				background-color:black;
				color:white;
			}
		</style>
	</head>
	<body>
		<h1>College Admission Form</h1><hr>
		<form>
			<label class="sub-head">Full Name of Applicant:</label>
			<input type="text" id="fst_name" class="name" name="name" placeholder="First Name" required>
			<input type="text" id="mid_name" class="name" name="name" placeholder="Middle Name" required>
			<input type="text" id="lst_name" class="name" name="name" placeholder="Last Name" required><br><br>
			
			<label>Date of Birth:</label>
			<input type="date"id="dob" name="dob" class="name" required><br><br>
			
			<label>Applicant's mail:</label>
			<input type="email" id="email" name="email" class="name" placeholder="Enter your E-mail" required><br><br>

			<label>Applicant's Phone:</label>
			<input type="number" id="phno" class="name" name="phno" placeholder="Enter the Phone number"><br><br>
			
			<label>Permanent Address:</label>
			<textarea></textarea>
			<!--<input type="text" id="city" name="city" class="name" placeholder="City">
			<input type="text" id="State" name="State" class="name" placeholder="State">
			<input type="number" id="pin" name="pin" class="name" placeholder="pincode">
			-->
			<select>
				<option>Country</option>
				<option>India</option>
				<option>Japan</option>
				<option>UK</option>
				<option>China</option>
			</select><br><br>
			
			<label>Select Course:</label><br><br>
			<input type="radio" id="python" class="course"  name="course">Python<br><br>
			<input type="radio" id="Java" class="course" name="course">Java<br><br>
			<input type="radio" id="C++" class="course" name="course">C++<br><br>
			<input type="radio" id="cython" class="course"  name="course">cython<br><br><br>
			
			<label>Joining Date:</label>
			<input type="date" id="date" class="name" name="date" required><br><br>
			
			<label>Attached the HSLC Certificate:</label>
			<input type="file" id="file" name="file" class="name" required><br><br>
		
			<center><button>Apply Now</button></center>
		</form>
	</body>
</html>
